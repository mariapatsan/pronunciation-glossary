<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Произносительный глоссарий</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Профессиональный английский</p>
      <h1>Произносительный глоссарий</h1>
      <p>Сравните произношение слов и словосочетания.</p>
    </header>

    <section class="glossary" aria-labelledby="group-1-title">
      <h2 id="group-1-title">Cyber security</h2>
      <div class="formula" role="group" aria-label="cyber плюс security равно cybersecurity">
        <button class="term-button" type="button" data-word="cyber" data-lang="en-AU" data-audio="audio/cyber.mp3">
          <span class="term" lang="en">cyber</span>
          <span class="ipa">/ˈsaɪ.bər/</span>
          <span class="hint">AU · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">+</span>
        <button class="term-button" type="button" data-word="security" data-lang="en-US" data-audio="audio/security.mp3">
          <span class="term" lang="en">security</span>
          <span class="ipa">/səˈkjʊr.ə.ti/</span>
          <span class="hint">US · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">=</span>
        <button class="term-button term-button--phrase" type="button" data-word="cybersecurity" data-lang="en-CA" data-audio="audio/cybersecurity.mp3">
          <span class="term" lang="en">cybersecurity</span>
          <span class="ipa">/ˈsaɪ.bər.səˈkjʊr.ə.ti/</span>
          <span class="hint">CA · Прослушать</span>
        </button>
      </div>
    </section>

    <section class="glossary" aria-labelledby="group-2-title">
      <h2 id="group-2-title">Cloud storage</h2>
      <div class="formula" role="group" aria-label="cloud плюс storage равно cloud storage">
        <button class="term-button" type="button" data-word="cloud" data-lang="en-US" data-audio="audio/cloud.mp3">
          <span class="term" lang="en">cloud</span>
          <span class="ipa">/klaʊd/</span>
          <span class="hint">US · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">+</span>
        <button class="term-button" type="button" data-word="storage" data-lang="en-US" data-audio="audio/storage.mp3">
          <span class="term" lang="en">storage</span>
          <span class="ipa">/ˈstɔːr.ɪdʒ/</span>
          <span class="hint">US · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">=</span>
        <button class="term-button term-button--phrase" type="button" data-word="cloud storage" data-lang="en-GB" data-audio="audio/cloud_storage.mp3">
          <span class="term" lang="en">cloud storage</span>
          <span class="ipa">/klaʊd ˈstɔːr.ɪdʒ/</span>
          <span class="hint">UK · Прослушать</span>
        </button>
      </div>
    </section>

    <section class="glossary" aria-labelledby="group-3-title">
      <h2 id="group-3-title">Machine learning</h2>
      <div class="formula" role="group" aria-label="machine плюс learning равно machine learning">
        <button class="term-button" type="button" data-word="machine" data-lang="en-GB" data-audio="audio/machine.mp3">
          <span class="term" lang="en">machine</span>
          <span class="ipa">/məˈʃiːn/</span>
          <span class="hint">UK · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">+</span>
        <button class="term-button" type="button" data-word="learning" data-lang="en-US" data-audio="audio/learning.mp3">
          <span class="term" lang="en">learning</span>
          <span class="ipa">/ˈlɜːr.nɪŋ/</span>
          <span class="hint">US · Прослушать</span>
        </button>
        <span class="operator" aria-hidden="true">=</span>
        <button class="term-button term-button--phrase" type="button" data-word="machine learning" data-lang="en-US" data-audio="audio/machine_learning.wav">
          <span class="term" lang="en">machine learning</span>
          <span class="ipa">/məˈʃiːn ˈlɜːr.nɪŋ/</span>
          <span class="hint">Прослушать</span>
        </button>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">
      Выберите слово или словосочетание.
    </p>

    <footer>
      <a href="README.md">Источники аудио и лицензии</a>
    </footer>
  </main>
</body>
</html>
